<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PAGE</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
background:#f2f2f2;
color:#333;
}

/* ===== ヘッダー ===== */
.header{
background:#f3f3f3;
display:flex;
justify-content:space-between;
align-items:center;
height:79px;
border-bottom:1px solid #e6e6e6;
}

.logo-area{
display:flex;
align-items:center;
margin-left:20px;
}

/* ロゴ縦構造 */
.logo-wrap{
display:flex;
flex-direction:column;
align-items:center;
margin-right:14px;
}

/* ===== 太さ強化ロゴ ===== */
.bts-mark{
height:40px;
width:auto;
}

/* BTS文字 */
.bts-under{
font-size:10px;
letter-spacing:6px;
margin-top:2px;
font-weight:700;
}

/* 右文字 */
.logo-text{
font-size:11px;
letter-spacing:3px;
line-height:1.15;
font-weight:700;
color:#000;
}

/* 右側 */
.right-area{
display:flex;
align-items:center;
height:100%;
}

.mail{
font-size:20px;
color:#bbb;
margin-right:16px;
}

.menu {
background: #2e8baa;
color: white;
height: 80px;
width: 120px;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
gap: 8px;
font-weight: 600;
letter-spacing: 2px;
}

.hamburger {
display: flex;
flex-direction: column;
gap: 4px;
}

.hamburger span {
width: 24px;
height: 2px;
background: white;
display: block;
}

.menu-text {
font-size: 14px;
}


/* ===== 黒バー ===== */
.title-bar{
background:#000;
color:#fff;
text-align:center;
padding:16px 0;
font-size:18px;
letter-spacing:4px;
}

/* ===== フォーム ===== */
.container{
padding:24px 18px 60px;
}

.label{
font-size:13px;
color:#777;
margin-top:22px;
margin-bottom:6px;
}

.value-text{
font-size:18px;
margin-bottom:10px;
color:#555;
}

.input-box{
width:100%;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
box-sizing:border-box;
background:#fff;
}

.note{
font-size:12px;
color:#666;
margin-top:6px;
line-height:1.6;
}

.note-blue{
font-size:12px;
color:#1e88a8;
margin-top:6px;
line-height:1.6;
}

select{
appearance:none;
width:100%;
padding:15px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
background:#fff;
background-image:
linear-gradient(45deg, transparent 50%, #999 50%),
linear-gradient(135deg, #999 50%, transparent 50%);
background-position:
calc(100% - 20px) calc(50% - 3px),
calc(100% - 15px) calc(50% - 3px);
background-size:5px 5px;
background-repeat:no-repeat;
box-sizing:border-box;
}

.btn{
width:100%;
padding:20px;
margin-top:28px;
border:none;
font-size:15px;
letter-spacing:1px;
}

.btn-blue{ background:#1b8fb9; color:#fff; }
.btn-gray{ background:#7c7c7c; color:#fff; }
.btn-black{ background:#000; color:#fff; }

</style>
</head>

<body>

<div class="header">
<div class="logo-area">

<div class="logo-wrap">
<!-- 太さ調整SVG -->
<svg class="bts-mark" viewBox="0 0 100 200">
<!-- 左パネル（太く） -->
<polygon points="8,0 48,18 48,182 8,200" fill="#000"/>
<!-- 右パネル（太く・中央狭め） -->
<polygon points="52,18 92,0 92,200 52,182" fill="#000"/>
</svg>
<div class="bts-under">BTS</div>
</div>

<div class="logo-text">
JAPAN<br>
OFFICIAL<br>
MOBILE
</div>

</div>

<div class="right-area">
<div class="mail">✉</div>
<div class="menu">
<div class="hamburger">
<span></span>
<span></span>
<span></span>
</div>
<div class="menu-text">MENU</div>
</div>
</div>
</div>

<div class="title-bar">MY PAGE</div>

<div class="container">
<div class="label">モバイルID</div>
<div class="value-text">Z4963</div>
<div class="label">ハンドルネーム</div>
<input class="input-box" type="text" value="yoonami">
<div class="note-blue">
※全角・半角ともに10文字以内（絵文字・記号不可）
</div>

<div class="label">メールアドレス</div>
<input class="input-box" type="email" value="macchacai@yahoo.com">

<div class="note">
〈半角英数字〉（例）aaaa@aaa.jp<br>
会員専用ページのログインIDとして使用されます。
</div>

<div class="note-blue">
※自動送信メール「noreply@m.bts-official.jp」を受信できるように設定してください。
</div>

<div class="label">パスワード※</div>
<input class="input-box" type="password" value="password123">

<div class="label">確認用パスワード※</div>
<input class="input-box" type="password">

<div class="label">好きなメンバー</div>
<select>
<option>RM</option>
<option>SUGA</option>
<option>JIN</option>
<option>J-HOPE</option>
<option>JIMIN</option>
<option>V</option>
<option>JUNG KOOK</option>
</select>

<button class="btn btn-blue">登録情報を更新する</button>
<button class="btn btn-gray">メールマガジンの設定はこちら</button>
<button class="btn btn-black">ログアウト</button>

</div>

</body>
</html>

</body>
</html>
