<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PAGE</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
background:#f3f3f3;
color:#333;
}

/* ===== ヘッダー ===== */
.header{
background:#fff;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 16px;
border-bottom:1px solid #e6e6e6;
}

.logo-area{
display:flex;
align-items:center;
}

.mark{
position:relative;
width:16px;
height:36px;
margin-right:10px;
}
.mark:before,
.mark:after{
content:"";
position:absolute;
top:0;
width:6px;
height:36px;
background:#000;
}
.mark:before{ left:0; }
.mark:after{ right:0; }

.logo-text{
font-size:10px;
letter-spacing:2.5px;
line-height:1.3;
font-weight:500;
}

.right-area{
display:flex;
align-items:center;
}

.mail{
font-size:17px;
color:#aaa;
margin-right:14px;
}

.menu{
background:#1b8fb9;
color:#fff;
padding:14px 18px;
font-size:12px;
letter-spacing:1px;
}

/* ===== 黒バー ===== */
.title-bar{
background:#000;
color:#fff;
text-align:center;
padding:15px 0;
font-size:17px;
letter-spacing:3px;
}

/* ===== フォーム ===== */
.container{
padding:22px 18px 60px;
}

label{
display:block;
margin-top:24px;
font-size:13px;
color:#666;
}

input, select{
width:100%;
padding:16px;
margin-top:8px;
border-radius:10px;
border:1px solid #dcdcdc;
font-size:16px;
background:#fff;
box-sizing:border-box;
}

.note{
font-size:12px;
color:#1b8fb9;
margin-top:8px;
line-height:1.6;
}

/* セレクト矢印再現 */
select{
appearance:none;
background-image:
linear-gradient(45deg, transparent 50%, #999 50%),
linear-gradient(135deg, #999 50%, transparent 50%);
background-position:
calc(100% - 20px) calc(50% - 3px),
calc(100% - 15px) calc(50% - 3px);
background-size:5px 5px;
background-repeat:no-repeat;
}

/* ===== ボタン ===== */
.btn{
width:100%;
padding:20px;
margin-top:28px;
border:none;
font-size:15px;
letter-spacing:1px;
}

.btn-blue{
background:#1b8fb9;
color:#fff;
}

.btn-gray{
background:#7c7c7c;
color:#fff;
}

.btn-black{
background:#000;
color:#fff;
}
</style>
</head>

<body>

<div class="header">
<div class="logo-area">
<div class="mark"></div>
<div class="logo-text">
JAPAN<br>
OFFICIAL<br>
MOBILE
</div>
</div>
<div class="right-area">
<div class="mail">✉</div>
<div class="menu">MENU</div>
</div>
</div>

<div class="title-bar">MY PAGE</div>

<div class="container">

<label>モバイルID</label>
<input type="text" value="Z4963">

<label>ハンドルネーム</label>
<input type="text" value="yoonami">
<div class="note">※全角・半角ともに10文字以内（絵文字・記号不可）</div>

<label>メールアドレス</label>
<input type="email" value="macchacai@yahoo.com">
<div class="note">※自動送信メールを受信できるよう設定してください。</div>

<label>パスワード※</label>
<input type="password" value="password123">

<label>確認用パスワード※</label>
<input type="password">

<label>好きなメンバー</label>
<select>
<option>SUGA</option>
<option>SAMPLE B</option>
<option>SAMPLE C</option>
</select>

<button class="btn btn-blue">登録情報を更新する</button>
<button class="btn btn-gray">メールマガジンの設定はこちら</button>
<button class="btn btn-black">ログアウト</button>

</div>

</body>
</html>
